# Isolate the native builds behind the new opt-ins. Existing macOS defaults
# and the existing Linux "mimalloc" feature must not compile an unused C library.
[package]
name = "rs-alloc-alternatives"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Target-specific optional allocator dependencies for rs-alloc"
repository = "https://github.com/codixor/rs-alloc"

[features]
auto = []
macos-jemalloc = ["dep:tikv-jemallocator"]
linux-mimalloc = ["dep:mimalloc"]

[target.'cfg(target_os = "macos")'.dependencies]
tikv-jemallocator = { version = "0.7.0", optional = true }

[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, optional = true }

# These are the measured mimalloc ABIs for the opt-in profile. The physical
# mobile fallback can be checked without compiling a native allocator.
[target.'cfg(any(all(any(target_os = "windows", target_os = "macos"), any(target_arch = "x86_64", target_arch = "aarch64")), all(target_os = "android", target_arch = "x86_64"), all(target_os = "ios", target_arch = "aarch64", target_abi = "sim")))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

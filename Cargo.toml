[workspace]
exclude = ["target"]
resolver = "3"

[package]
name = "rs-auto-alloc"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "Compile-time global allocator selection for hosted Rust programs and bare-metal firmware"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codixor/rs-alloc"
keywords = ["allocator", "jemalloc", "mimalloc", "tcmalloc", "embedded"]
categories = ["memory-management"]

[lib]
name = "rs_alloc"

[features]
default = ["jemalloc", "dep:mimalloc"]
# Workload-tuned policy for explicitly opted-in applications.
auto = ["dep:autotools", "dep:tcmalloc", "dep:libmimalloc-sys", "dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]
macos-jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]
mobile-mimalloc = ["dep:mimalloc"]
# Separate opt-in for Linux processes that do not lock their address space.
linux-mimalloc = ["dep:mimalloc"]
tcmalloc = ["dep:autotools", "dep:tcmalloc"]

[build-dependencies]
autotools = { version = "0.2.7", optional = true }

[dependencies]
cfg-if = "1"

[target.'cfg(any(target_os = "macos", all(target_os = "linux", any(target_arch = "arm", target_arch = "x86_64", target_arch = "aarch64"))))'.dependencies]
tikv-jemallocator = { version = "0.7.0", optional = true }

[target.'cfg(all(any(target_os = "macos", target_os = "windows"), any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"], optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "android", target_os = "ios", all(target_os = "linux", any(target_arch = "arm", target_arch = "x86_64", target_arch = "aarch64"))))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, optional = true }

[target.'cfg(all(any(all(target_os = "linux", target_env = "gnu"), target_os = "macos"), any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
tcmalloc = { version = "0.3.0", optional = true }

[target.'cfg(target_os = "none")'.dependencies]
embedded-alloc = { version = "0.7.0", default-features = false, features = ["llff"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1.6", features = ["mm", "process", "std"] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

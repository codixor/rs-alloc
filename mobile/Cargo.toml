# A separate target-scoped dependency lets the legacy desktop flag keep its
# original dependency graph and the physical mobile auto fallback stay C-free.
[package]
name = "rs-alloc-mobile"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Mobile allocator opt-ins for rs-alloc"
repository = "https://github.com/codixor/rs-alloc"

[features]
explicit = ["dep:mimalloc"]

[target.'cfg(any(all(target_os = "android", target_arch = "x86_64"), all(target_os = "ios", target_arch = "aarch64", target_abi = "sim")))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[target.'cfg(all(any(target_os = "android", target_os = "ios"), not(any(all(target_os = "android", target_arch = "x86_64"), all(target_os = "ios", target_arch = "aarch64", target_abi = "sim")))))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, optional = true }

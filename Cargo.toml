[workspace]
members = ["desktop"]
default-members = ["."]
exclude = ["backends", "mobile"]
resolver = "3"

[package]
name = "rs-alloc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Compile-time global allocator selection for hosted Rust programs and bare-metal firmware"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codixor/rs-alloc"
keywords = ["allocator", "jemalloc", "mimalloc", "tcmalloc", "embedded"]
categories = ["memory-management"]

[features]
default = ["jemalloc"]
# Workload-tuned policy for explicitly opted-in applications.
auto = ["dep:tcmalloc", "dep:rs-alloc-desktop", "dep:rs-alloc-mobile"]
jemalloc = ["dep:tikv-jemallocator"]
macos-jemalloc = ["alternative-backends/macos-jemalloc"]
mimalloc = ["dep:mimalloc"]
mobile-mimalloc = ["rs-alloc-mobile/explicit"]
# Separate opt-in for Linux processes that do not lock their address space.
linux-mimalloc = ["alternative-backends/linux-mimalloc"]
tcmalloc = ["dep:tcmalloc"]

[dependencies]
cfg-if = "1"
alternative-backends = { package = "rs-alloc-alternatives", path = "backends", version = "0.1.0", optional = true }

[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
tikv-jemallocator = { version = "0.7.0", optional = true }

[target.'cfg(all(any(target_os = "macos", target_os = "windows"), any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
rs-alloc-desktop = { path = "desktop", version = "0.1.0", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, optional = true }

[target.'cfg(all(any(all(target_os = "linux", target_env = "gnu"), target_os = "macos"), any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
tcmalloc = { version = "0.3.0", optional = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rs-alloc-mobile = { path = "mobile", version = "0.1.0", optional = true }

[target.'cfg(target_os = "none")'.dependencies]
embedded-alloc = { version = "0.7.0", default-features = false, features = ["llff"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1.6", features = ["mm", "process", "std"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

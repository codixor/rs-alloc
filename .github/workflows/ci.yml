name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # jemalloc, x86_64 and arm64 (the arm64 runner checks the 64 KiB page build too)
          - { os: ubuntu-24.04, name: linux-x86_64, tc_feature: tcmalloc }
          - { os: ubuntu-24.04-arm, name: linux-arm64, lg_page: "16", tc_feature: auto }
          # system allocator by default; mimalloc with the feature
          - { os: macos-15, name: macos, tc_feature: tcmalloc }
          - { os: windows-2025, name: windows, warnings: deny }
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      JEMALLOC_SYS_WITH_MALLOC_CONF: narenas:4,retain:false
      CARGO_BUILD_WARNINGS: ${{ matrix.warnings || 'warn' }}
    steps:
      - uses: actions/checkout@v4
      - name: 64 KiB jemalloc pages on arm64
        if: matrix.lg_page != ''
        shell: bash
        run: echo "JEMALLOC_SYS_WITH_LG_PAGE=${{ matrix.lg_page }}" >> "$GITHUB_ENV"
      - run: rustup show active-toolchain
      - name: Default features
        run: cargo test
      - name: No features (the system allocator everywhere)
        run: cargo test --no-default-features
      - name: mimalloc feature
        run: cargo test --features mimalloc
      - name: Desktop automatic allocator and layout boundary tests
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: cargo test --locked --no-default-features --features auto
      - name: Verify the installed TCMalloc is linked statically
        if: matrix.tc_feature != ''
        shell: bash
        env:
          TC_FEATURE: ${{ matrix.tc_feature }}
        run: |
          cargo test --locked --no-default-features --features "$TC_FEATURE" --test selected
          cargo build --locked --no-default-features --features "$TC_FEATURE" --example allocator_bench
          exe=target/debug/examples/allocator_bench
          "$exe" single | grep '"allocator":"tcmalloc"'
          if [[ "$RUNNER_OS" == macOS ]]; then
            deps=$(otool -L "$exe")
          else
            deps=$(readelf -d "$exe")
          fi
          echo "$deps"
          if grep -Ei 'lib(tcmalloc|profiler)' <<< "$deps"; then exit 1; fi
          nm "$exe" > "$RUNNER_TEMP/allocator-symbols.txt"
          grep -E ' [Tt] _?tc_memalign$' "$RUNNER_TEMP/allocator-symbols.txt"
          grep -E ' [Tt] _?tc_free$' "$RUNNER_TEMP/allocator-symbols.txt"
      # The runner's memory-lock limit is too small for mlockall: raise it for
      # this shell and require the test to lock (fail, not skip).
      - name: Bounded under mlockall
        if: runner.os == 'Linux'
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          RS_ALLOC_REQUIRE_MLOCK=1 cargo test --test mlock -- --nocapture

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85 --profile minimal
      - run: cargo +1.85 test

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
